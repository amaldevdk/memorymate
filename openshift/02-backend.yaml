apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: memorymate
    component: backend
type: Opaque
stringData:
  JWT_SECRET: memorymate_openshift_secure_jwt_key_2026
  # Internal Kubernetes DNS URL to MongoDB service
  MONGODB_URI: mongodb://memorymate_user:memorymate_secure_pass_2026@mongodb:27017/memorymate?authSource=memorymate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorymate-backend
  labels:
    app: memorymate
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memorymate
      component: backend
  template:
    metadata:
      labels:
        app: memorymate
        component: backend
    spec:
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/memorymate/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MONGODB_URI
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: memorymate-backend
  labels:
    app: memorymate
    component: backend
spec:
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: memorymate
    component: backend
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: memorymate-api
  labels:
    app: memorymate
    component: backend
spec:
  to:
    kind: Service
    name: memorymate-backend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
