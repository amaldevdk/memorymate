apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  labels:
    app: memorymate
    component: database
type: Opaque
stringData:
  database-name: memorymate
  database-user: memorymate_user
  database-password: memorymate_secure_pass_2026
  database-admin-password: memorymate_admin_pass_2026
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  labels:
    app: memorymate
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: memorymate
    component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memorymate
      component: database
  template:
    metadata:
      labels:
        app: memorymate
        component: database
    spec:
      containers:
        - name: mongodb
          image: registry.redhat.io/rhel9/mongodb-60:latest
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: database-user
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: database-password
            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: database-name
            - name: MONGODB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: database-admin-password
          volumeMounts:
            - name: mongodb-data
              mountPath: /var/lib/mongodb/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: memorymate
    component: database
spec:
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: memorymate
    component: database
